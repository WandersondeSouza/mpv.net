# Exemplo simples de thumbfast.conf
# Configuração do script thumbfast

# Em algumas versões do mpv.net portátil,
# pode ser necessário utilizar um mpv.exe separado.

# Exemplo:
# mpv_path=C:/mpv/mpv.exe

# Ajuste conforme sua instalação.

# Tamanho do thumbnail
thumbsize=200

# Qualidade
max_height=200

# Cache
cache=yes

# IMPORTANTE:
# Alguns usuários relataram problemas com thumbfast
# usando apenas mpvnet.exe.
# Em alguns casos, usar um mpv.exe separado resolve o problema.
