# Exemplo simples de thumbfast.conf.
# Copie este arquivo para:
#
# portable_config/script-opts/thumbfast.conf
#
# O arquivo thumbfast.lua deve ficar em:
#
# portable_config/scripts/thumbfast.lua
#
# O thumbfast oferece suporte direto ao mpv.net v7.
# Nao configure mpv_path por padrao.
# Use mpv_path apenas como fallback para versoes antigas
# ou se a documentacao atual do thumbfast indicar essa necessidade.
#
# Exemplo de fallback:
# mpv_path=C:/mpv/mpv.exe

# Tamanho do thumbnail
thumbsize=200

# Qualidade
max_height=200

# Cache
cache=yes

# IMPORTANTE:
# O thumbfast nao desenha os thumbnails sozinho.
# Ele precisa de uma UI/script compatível que consuma as mensagens do thumbfast.
