# Portable mpv/mpv.net configuration.
# Add mpv options here when you want this package to keep settings inside portable_config.
#
# Examples:
# pause=yes
# reset-on-next-file=pause
# volume=100
# hwdec=auto-safe

# Optional profile for unstable HTTP/IPTV/Xtream streams.
# Use with: --profile=streaming-iptv
[streaming-iptv]
cache=yes
cache-pause-initial=yes
cache-pause-wait=60
demuxer-max-bytes=128MiB
network-timeout=60

# Profile used by IPTV Media Center when this portable package is launched from it.
# It keeps integration defaults out of normal mpv.net startup.
[iptv-media-center]
force-window=yes
idle=no
cache=yes
cache-pause-initial=yes
cache-pause-wait=60
demuxer-max-bytes=128MiB
network-timeout=60
volume=100
