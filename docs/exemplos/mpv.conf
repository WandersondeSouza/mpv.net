# Exemplo simples de mpv.conf
# Arquivo de configuração do mpv/mpv.net

# Iniciar vídeo pausado
pause=yes
reset-on-next-file=pause

# Adicionar arquivos arrastados à playlist
# em vez de substituir a playlist atual

drag-and-drop=append

# Volume inicial
volume=100

# Habilitar hardware decoding automático
hwdec=auto-safe

# Salvar posição do vídeo automaticamente
save-position-on-quit=yes

# Capturas de tela em PNG
screenshot-format=png

# Mostrar OSD
osd-level=1

# Exemplo de cache de rede
cache=yes

# Perfil opcional para streams HTTP/IPTV/Xtream com buffer instavel.
# Ative com: --profile=streaming-iptv
[streaming-iptv]
cache=yes
cache-pause-initial=yes
cache-pause-wait=60
demuxer-max-bytes=128MiB
network-timeout=60

# Descomente para fullscreen automático
# fullscreen=yes

# Perfil usado pelo IPTV Media Center ao iniciar este player.
# As opcoes abaixo so sao aplicadas quando o player recebe:
# --profile=iptv-media-center
[iptv-media-center]
force-window=yes
idle=no
cache=yes
cache-pause-initial=yes
cache-pause-wait=60
demuxer-max-bytes=128MiB
network-timeout=60
volume=100
