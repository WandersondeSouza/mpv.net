name: Release packages

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with generated assets
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      create_installer:
        description: Also generate the Inno Setup installer
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  release-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install packaging tools
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip -y --no-progress
          }

          if ('${{ inputs.create_installer }}' -eq 'true' -and -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Restore and build
        shell: pwsh
        run: dotnet build src\MpvNet.Windows\MpvNet.Windows.csproj

      - name: Restore native release-only files from secrets
        shell: pwsh
        env:
          MEDIAINFO_DLL_BASE64: ${{ secrets.MEDIAINFO_DLL_BASE64 }}
          MPVNET_COM_BASE64: ${{ secrets.MPVNET_COM_BASE64 }}
        run: |
          $nativeDir = Join-Path $env:RUNNER_TEMP 'mpvnet-native'
          New-Item -ItemType Directory -Force $nativeDir | Out-Null

          if ($env:MEDIAINFO_DLL_BASE64) {
            [IO.File]::WriteAllBytes((Join-Path $nativeDir 'MediaInfo.dll'), [Convert]::FromBase64String($env:MEDIAINFO_DLL_BASE64))
          }

          if ($env:MPVNET_COM_BASE64) {
            [IO.File]::WriteAllBytes((Join-Path $nativeDir 'mpvnet.com'), [Convert]::FromBase64String($env:MPVNET_COM_BASE64))
          }

          "NATIVE_DIR=$nativeDir" >> $env:GITHUB_ENV

      - name: Generate packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @(
            (Join-Path $env:GITHUB_WORKSPACE 'src'),
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'),
            '-Repo',
            '${{ github.repository }}'
          )

          if ('${{ inputs.create_release }}' -ne 'true') {
            $releaseArgs += '-SkipGitHubRelease'
          }

          if ('${{ inputs.create_installer }}' -ne 'true') {
            $releaseArgs += '-SkipInstaller'
          }

          $mediaInfoFile = Join-Path $env:NATIVE_DIR 'MediaInfo.dll'
          if (Test-Path $mediaInfoFile) {
            $releaseArgs += @('-MediaInfoFile', $mediaInfoFile)
          }

          $mpvNetComFile = Join-Path $env:NATIVE_DIR 'mpvnet.com'
          if (Test-Path $mpvNetComFile) {
            $releaseArgs += @('-MpvNetComFile', $mpvNetComFile)
          }

          & .\src\Tools\release-mpv.net.ps1 @releaseArgs

      - name: Upload generated packages
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-release-packages
          path: artifacts/release/*
