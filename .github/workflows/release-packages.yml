name: Release packages

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release with generated assets
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      create_installer:
        description: Also generate the Inno Setup installer
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enable_file_logging:
        description: Build diagnostic packages with file logging enabled
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      create_store_package:
        description: Also generate the Microsoft Store MSIX package
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_notes:
        description: Release description written directly to the GitHub release body
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate Windows baseline
        shell: pwsh
        run: .\src\Tools\validate-windows-baseline.ps1

      - name: Install packaging tools
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip -y --no-progress
          }

          if ('${{ inputs.create_installer }}' -eq 'true' -and -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup -y --no-progress
          }

      - name: Guard diagnostic release publishing
        shell: pwsh
        run: |
          if ('${{ inputs.create_release }}' -eq 'true' -and '${{ inputs.enable_file_logging }}' -eq 'true') {
            throw 'Diagnostic packages are support artifacts only. Run with create_release=false when enable_file_logging=true.'
          }

      - name: Restore and build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet build src\MpvNet.Windows\MpvNet.Windows.csproj -c Release

      - name: Generate packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MPVNET_STORE_CERTIFICATE_KEYFILE: ${{ secrets.MPVNET_STORE_CERTIFICATE_KEYFILE }}
          MPVNET_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MPVNET_STORE_CERTIFICATE_PASSWORD }}
          MPVNET_STORE_PUBLISHER: ${{ secrets.MPVNET_STORE_PUBLISHER }}
          MPVNET_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $releaseArgs = @{
            SourceDir = Join-Path $env:GITHUB_WORKSPACE 'src'
            OutputRootDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
            Repo = '${{ github.repository }}'
          }

          if ('${{ inputs.create_release }}' -ne 'true') {
            $releaseArgs.SkipGitHubRelease = $true
          }

          if ('${{ inputs.create_installer }}' -ne 'true') {
            $releaseArgs.SkipInstaller = $true
          }

          if ('${{ inputs.enable_file_logging }}' -eq 'true') {
            $releaseArgs.EnableFileLogging = $true
          }

          if ($env:MPVNET_RELEASE_NOTES) {
            $releaseArgs.ReleaseNotes = $env:MPVNET_RELEASE_NOTES
          }

          & .\src\Tools\build-release-package.ps1 @releaseArgs

      - name: Generate Microsoft Store package
        if: ${{ inputs.create_store_package == 'true' }}
        shell: pwsh
        env:
          MPVNET_STORE_CERTIFICATE_KEYFILE: ${{ secrets.MPVNET_STORE_CERTIFICATE_KEYFILE }}
          MPVNET_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MPVNET_STORE_CERTIFICATE_PASSWORD }}
          MPVNET_STORE_PUBLISHER: ${{ secrets.MPVNET_STORE_PUBLISHER }}
        run: |
          & .\src\Tools\publish-store-package.ps1 `
            (Join-Path $env:GITHUB_WORKSPACE 'src') `
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts\store')

      - name: Validate native dependencies in packages
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts\release -Filter '*-portable-x64.zip' | Select-Object -First 1
          if (-not $zip) {
            throw 'Portable x64 ZIP was not generated.'
          }

          .\src\Tools\validate-native-dependencies.ps1 -ZipFile $zip.FullName
          .\src\Tools\validate-native-dependencies.ps1 -Path .\src\MpvNet.Windows\bin\Release\win-x64\publish
          .\src\Tools\validate-package-contents.ps1 -ArchiveFile $zip.FullName
          .\src\Tools\validate-package-contents.ps1 -Path .\src\MpvNet.Windows\bin\Release\win-x64\publish

          if ('${{ inputs.create_store_package }}' -eq 'true') {
            $storePackages = @(Get-ChildItem artifacts\store -Recurse -File |
              Where-Object { $_.Extension -in @('.appx', '.msix', '.appxbundle', '.msixbundle', '.appxupload', '.msixupload') })
            if (-not $storePackages.Count) {
              throw 'Microsoft Store package was requested but no package archive was generated.'
            }

            foreach ($storePackage in $storePackages) {
              .\src\Tools\validate-native-dependencies.ps1 -ArchiveFile $storePackage.FullName
              .\src\Tools\validate-package-contents.ps1 -ArchiveFile $storePackage.FullName `
                  -RequiredRelativePaths 'MpvNet.Windows\mpvnet.exe', 'MpvNet.Windows\Scripts\osc.lua', 'MpvNet.Windows\libmpv-2.dll', 'MpvNet.Windows\libmpv-2-v3.dll'
            }
          }

      - name: Upload generated packages
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-release-packages
          path: artifacts/release/*

      - name: Upload Microsoft Store package
        if: ${{ inputs.create_store_package == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mpv.net-store-package
          path: artifacts/store/*
